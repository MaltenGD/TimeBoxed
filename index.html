<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TIMEBOXED</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="https://kit.fontawesome.com/811c19f576.js" crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </head>
    <body>
        <div class = "open">
            <div class = "openText" id="screen1">
                <h1>CLICK TO OPEN</h1>
                <div class = "openArrow">
                    <i class="fa-solid fa-caret-down"></i>
                </div>
            </div>
            <button class = "boxButton" onclick = "switchScreen(1);">
                <img src = "images/boxClosed.png" id="boxImg" alt = "closed box">
            </button>
        </div>

        <div class = "openedScreen" id="screen2">
            <div class = "title">
                <h1>TIMEBOXED</h1>
                <img src = "images/logo.png">
                <h2>by POPCAT GAMES</h2>
            </div>
        </div>
    </body>
</html>
